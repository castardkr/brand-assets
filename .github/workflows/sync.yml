name: Figma Asset Sync

on:
  # 매주 월요일 오전 9시 (KST = UTC+9 → UTC 0시)
  schedule:
    - cron: '0 0 * * 1'
  # 수동 실행 버튼
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Figma sync
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE:  ${{ secrets.FIGMA_FILE }}
        run: node scripts/sync.js

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: Figma 에셋 동기화 $(date '+%Y-%m-%d')"
            git push
          fi
