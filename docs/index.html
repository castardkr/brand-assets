<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upstage Brand Assets</title>
<style>
  /* Upstage Marketing tokens (DESIGN.md §2 / §3-M) */
  :root {
    --ink: #0D0D12;
    --ink-60: #5C5C66;
    --ink-20: #E1E4EA;
    --bg: #FFFFFF;
    --bg-subtle: #F8F9FB;
    --bg-muted: #F1F3F6;
    --primary: #805CFB;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  body[data-theme="dark"] {
    --ink: #F8F9FB;
    --ink-60: #A0A0AA;
    --ink-20: #2A2A33;
    --bg: #0D0D12;
    --bg-subtle: #16161D;
    --bg-muted: #1E1E27;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Pretendard', 'SF Pro Text', sans-serif;
    background: var(--bg-subtle);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 32px 32px 16px;
    border-bottom: 1px solid var(--ink-20);
    background: var(--bg);
  }
  header h1 {
    margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
  }
  header p {
    margin: 0; font-size: 13px; color: var(--ink-60);
  }
  header .meta a {
    color: var(--primary); text-decoration: none;
  }
  header .meta a:hover { text-decoration: underline; }

  .controls {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 16px 32px;
    border-bottom: 1px solid var(--ink-20);
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .controls input {
    flex: 1; min-width: 240px; max-width: 480px;
    height: 36px; padding: 0 12px;
    background: var(--bg-muted);
    border: 1px solid var(--ink-20);
    border-radius: var(--radius-md);
    color: var(--ink);
    font-size: 14px;
    outline: none;
  }
  .controls input:focus { border-color: var(--primary); }
  .controls .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 6px 12px;
    border: 1px solid var(--ink-20);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--ink); }
  .chip[data-active="true"] {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }
  .controls .toggles {
    display: flex; gap: 6px; margin-left: auto;
  }
  .controls .count {
    font-size: 12px; color: var(--ink-60); font-variant-numeric: tabular-nums;
  }

  main {
    padding: 24px 32px 64px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--ink-20);
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
    display: flex; flex-direction: column;
  }
  .card:hover { border-color: var(--primary); transform: translateY(-1px); }
  .card .thumb {
    aspect-ratio: 4 / 3;
    background: var(--bg-muted);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    border-bottom: 1px solid var(--ink-20);
  }
  .card .thumb[data-bg="dark"] {
    background: #0D0D12;
  }
  .card .thumb[data-bg="checker"] {
    background-image:
      linear-gradient(45deg, rgba(0,0,0,0.06) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(0,0,0,0.06) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(0,0,0,0.06) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(0,0,0,0.06) 75%);
    background-size: 12px 12px;
    background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    background-color: #FFFFFF;
  }
  .card .thumb img {
    max-width: 100%; max-height: 100%; object-fit: contain;
  }
  .card .meta {
    padding: 10px 12px;
    font-size: 11px;
    color: var(--ink-60);
  }
  .card .meta .name {
    color: var(--ink);
    font-weight: 500;
    font-size: 12px;
    margin-bottom: 2px;
    word-break: break-word;
  }
  .card .meta .tags {
    display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px;
  }
  .card .meta .tag {
    font-size: 10px;
    padding: 1px 6px;
    background: var(--bg-muted);
    border-radius: var(--radius-sm);
    color: var(--ink-60);
  }
  .empty {
    text-align: center;
    padding: 64px 16px;
    color: var(--ink-60);
    font-size: 14px;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: var(--radius-lg);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.2s, opacity 0.2s;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .toast[data-show="true"] {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast .url {
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: 11px;
    opacity: 0.7;
    margin-top: 2px;
  }

  @media (max-width: 600px) {
    header, .controls, main { padding-left: 16px; padding-right: 16px; }
    .controls { flex-direction: column; align-items: stretch; }
    .controls .toggles { margin-left: 0; }
  }
</style>
</head>
<body data-theme="light">
  <header>
    <h1>Upstage Brand Assets</h1>
    <p class="meta">
      <span id="total">…</span> SVGs · 매주 월 09:00 KST 자동 동기화 ·
      <a href="https://github.com/castardkr/brand-assets" target="_blank" rel="noopener">Repo ↗</a>
    </p>
  </header>

  <div class="controls">
    <input id="search" type="text" placeholder="Search: solar, document, lockup, white…" autocomplete="off" />
    <div class="filters" id="filters"></div>
    <span class="count" id="count">0 / 0</span>
    <div class="toggles">
      <button class="chip" id="bg-light" data-active="true">Light</button>
      <button class="chip" id="bg-dark">Dark</button>
      <button class="chip" id="bg-checker">Checker</button>
      <button class="chip" id="theme-toggle">🌙</button>
    </div>
  </div>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>매칭되는 자산이 없습니다.</div>
  </main>

  <div class="toast" id="toast">
    <div>URL copied</div>
    <div class="url" id="toast-url"></div>
  </div>

<script>
(() => {
  const REPO = 'castardkr/brand-assets';
  const CDN = `https://cdn.jsdelivr.net/gh/${REPO}@main`;
  const RAW = `https://raw.githubusercontent.com/${REPO}/main`;
  const JSON_URL = `${RAW}/brand-assets.json`;

  const $ = (id) => document.getElementById(id);
  let assets = [];
  let activeCategory = 'all';
  let bgMode = 'light';

  async function load() {
    try {
      const res = await fetch(JSON_URL);
      const data = await res.json();
      assets = data.assets || [];
      $('total').textContent = data.total ?? assets.length;
      buildFilters();
      render();
    } catch (e) {
      $('grid').innerHTML = `<div class="empty">로딩 실패: ${e.message}</div>`;
    }
  }

  function categories() {
    const set = new Set(assets.map(a => a.page));
    return ['all', ...[...set].sort()];
  }

  function buildFilters() {
    const wrap = $('filters');
    wrap.innerHTML = '';
    for (const cat of categories()) {
      const b = document.createElement('button');
      b.className = 'chip';
      b.dataset.active = cat === activeCategory ? 'true' : 'false';
      b.textContent = cat === 'all' ? `All (${assets.length})` : cat;
      b.addEventListener('click', () => {
        activeCategory = cat;
        for (const c of wrap.querySelectorAll('.chip')) c.dataset.active = 'false';
        b.dataset.active = 'true';
        render();
      });
      wrap.appendChild(b);
    }
  }

  function render() {
    const q = $('search').value.trim().toLowerCase();
    const filtered = assets.filter(a => {
      if (activeCategory !== 'all' && a.page !== activeCategory) return false;
      if (!q) return true;
      const hay = [a.id, a.name, a.page, a.type, a.color, a.usage].join(' ').toLowerCase();
      return q.split(/\s+/).every(t => hay.includes(t));
    });
    $('count').textContent = `${filtered.length} / ${assets.length}`;
    const grid = $('grid');
    const empty = $('empty');
    if (filtered.length === 0) {
      grid.innerHTML = '';
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    grid.innerHTML = filtered.map(a => `
      <div class="card" data-id="${a.id}" data-file="${a.file}" data-name="${a.name}">
        <div class="thumb" data-bg="${bgMode}">
          <img src="${RAW}/${a.file}" alt="${a.name}" loading="lazy" />
        </div>
        <div class="meta">
          <div class="name">${a.name}</div>
          <div>${a.page}</div>
          <div class="tags">
            ${a.color ? `<span class="tag">${a.color}</span>` : ''}
            ${a.type ? `<span class="tag">${a.type}</span>` : ''}
          </div>
        </div>
      </div>
    `).join('');
  }

  function showToast(url) {
    $('toast-url').textContent = url;
    const t = $('toast');
    t.dataset.show = 'true';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { t.dataset.show = 'false'; }, 2200);
  }

  document.addEventListener('click', async (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    const file = card.dataset.file;
    const url = `${CDN}/${file}`;
    try {
      await navigator.clipboard.writeText(url);
      showToast(url);
    } catch {
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast(url);
    }
  });

  $('search').addEventListener('input', render);

  for (const mode of ['light', 'dark', 'checker']) {
    $(`bg-${mode}`).addEventListener('click', () => {
      bgMode = mode;
      for (const m of ['light', 'dark', 'checker']) {
        $(`bg-${m}`).dataset.active = m === mode ? 'true' : 'false';
      }
      for (const t of document.querySelectorAll('.thumb')) t.dataset.bg = mode;
    });
  }

  $('theme-toggle').addEventListener('click', () => {
    const cur = document.body.dataset.theme;
    const next = cur === 'dark' ? 'light' : 'dark';
    document.body.dataset.theme = next;
    $('theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
  });

  load();
})();
</script>
</body>
</html>
